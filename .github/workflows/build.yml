name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tim source
        id: src
        run: |
          if [ -f build.gradle ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            Z="$(ls -t *.zip | head -1)"
            echo "Dung file: $Z"
            unzip -q "$Z" -d proj
            echo "dir=proj" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build
        working-directory: ${{ steps.src.outputs.dir }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LanAnhClient-jar
          path: ${{ steps.src.outputs.dir }}/build/libs/*.jar
